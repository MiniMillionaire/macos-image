name: Prepare offline Xcode 27.1 RC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-xcode-m5
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'MiniMillionaire/macos-image' &&
      github.ref == 'refs/heads/main' &&
      github.actor == (vars.TRUSTED_ACTOR || 'cocoa-xu') &&
      github.triggering_actor == (vars.TRUSTED_ACTOR || 'cocoa-xu')
    runs-on: [miso-xcode-m5]
    timeout-minutes: 90
    env:
      XCODE_WORK_NAME: offline-xcode-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cocoa-xu/miso@main
        with:
          version: source
          xcode-base-url: ${{ secrets.XCODE_BASE_URL }}
      - name: Prepare Apple-signed Xcode without starting a VM
        id: prepare
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          XCODE_WORK="$RUNNER_TEMP/$XCODE_WORK_NAME"
          mkdir "$XCODE_WORK"
          sw_vers > "$XCODE_WORK/host.txt"
          xcodebuild -version >> "$XCODE_WORK/host.txt"
          miso --version >> "$XCODE_WORK/host.txt"
          miso xcode prepare-archive --config config/miso/27.0.1/xcode-27.1rc.json \
            --target-version 27.0.1 --target-build 26A434 --output "$XCODE_WORK/archive" \
            > "$XCODE_WORK/archive-result.json"
          miso xcode prepare-packages --prepared "$XCODE_WORK/archive" \
            --output "$XCODE_WORK/packages" > "$XCODE_WORK/packages-result.json"
          jq -n --arg path "$XCODE_WORK" --arg revision "$GITHUB_SHA" \
            '{path:$path,revision:$revision,vmStarted:false,runtimeVerified:false}' \
            > "$XCODE_WORK/prepared.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-xcode-27.1rc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.XCODE_WORK_NAME }}/host.txt
            ${{ runner.temp }}/${{ env.XCODE_WORK_NAME }}/prepared.json
            ${{ runner.temp }}/${{ env.XCODE_WORK_NAME }}/*-result.json
            ${{ runner.temp }}/${{ env.XCODE_WORK_NAME }}/archive/archive.json
            ${{ runner.temp }}/${{ env.XCODE_WORK_NAME }}/archive/journal.json
            ${{ runner.temp }}/${{ env.XCODE_WORK_NAME }}/packages/packages.json
            ${{ runner.temp }}/${{ env.XCODE_WORK_NAME }}/packages/journal.json
          retention-days: 30
