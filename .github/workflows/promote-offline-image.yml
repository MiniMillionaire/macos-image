name: Publish offline macOS images
run-name: Publish macOS ${{ inputs.macos_version }} ${{ inputs.image_type }}

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS version
        type: string
        default: '27.0.1'
        required: true
      image_type:
        description: Image type
        type: choice
        options: [vanilla, base, xcode]
        required: true
      replace_existing:
        description: Replace an existing image tag
        type: boolean
        default: false
      before_acceptance:
        description: Publish before VM acceptance
        type: boolean
        default: false
      xcode_version:
        description: Xcode version
        type: string
        default: ''
      xcode_flavor:
        description: Xcode flavor
        type: choice
        options: [full, slim]
        default: full

permissions:
  contents: read

concurrency:
  group: macos-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'MiniMillionaire/macos-image' &&
      github.ref == 'refs/heads/main' &&
      github.actor == (vars.TRUSTED_ACTOR || 'cocoa-xu') &&
      github.triggering_actor == (vars.TRUSTED_ACTOR || 'cocoa-xu')
    runs-on: ${{ inputs.image_type == 'xcode' && 'xcode-27' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cocoa-xu/miso@v0.5.2
        if: inputs.image_type == 'xcode'
        with:
          version: 0.5.2
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4
      - name: Publish image digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_PROFILE: ${{ inputs.macos_version }}
          VARIANT: ${{ inputs.image_type }}
          XCODE_VERSION: ${{ inputs.xcode_version }}
          XCODE_FLAVOR: ${{ inputs.xcode_flavor }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          BEFORE_ACCEPTANCE: ${{ inputs.before_acceptance }}
        run: bash ci/promote-offline-image.sh
